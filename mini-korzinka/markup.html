                <button type="button" class="preparaty__mini-nav-btn" role="tab" aria-selected="false" data-action="mkb-visit" data-visit="inpatient">Стационар</button>
              </div>
              <div class="preparaty__mini-nav preparaty__mkb-filter-nav preparaty__mkb-filter-nav--age" role="tablist" aria-label="Возраст пациента">
                <button type="button" class="preparaty__mini-nav-btn is-active" role="tab" aria-selected="true" data-action="mkb-age" data-age="adult">Взрослый</button>
                <button type="button" class="preparaty__mini-nav-btn" role="tab" aria-selected="false" data-action="mkb-age" data-age="child">Ребенок</button>
              </div>
            </div>
          </form>
          <div class="preparaty__mini-tabs-shell" data-role="mini-tabs" aria-label="Раздел назначений"></div>
          <div class="preparaty__mini-panel-list" data-role="mini-list"></div>
        </div>
        <div class="preparaty__ai-chat" data-role="ai-chat" hidden>
          <div class="preparaty__ai-thread" data-role="ai-thread" aria-live="polite"></div>
          <form class="preparaty__ai-compose" data-role="ai-compose" action="#" autocomplete="off">
            <textarea
              class="preparaty__ai-input"
              data-role="ai-input"
              rows="1"
              maxlength="1000"
              placeholder="Задайте вопрос по клиническим рекомендациям…"
              aria-label="Сообщение для EasyMed AI"
            ></textarea>
            <button type="submit" class="preparaty__ai-send" data-action="ai-send" title="Отправить" aria-label="Отправить">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2.2 8.1 L13.4 2.6c.5-.25.95.2.7.7L8.6 13.7c-.25.5-.9.4-1-.15L6.4 9.1 2.35 7.9c-.55-.2-.45-.85-.15-.8z"/></svg>
            </button>
          </form>
        </div>
        <div class="preparaty__mini-ix" data-role="mini-ix" hidden>
          <div class="preparaty__mini-ix-search-wrap">
            <div class="preparaty__mkb-search-row preparaty__mini-ix-search-row">
              <input
                class="preparaty__mkb-search-input"
                type="search"
                data-role="mini-ix-query"
                name="mini-ix-query"
                placeholder="Дополнительный препарат (необязательно)…"
                maxlength="80"
                autocomplete="off"
                aria-label="Дополнительный препарат для проверки с выбранными"
                aria-autocomplete="list"
                aria-controls="preparaty-mini-ix-hints"
              />
            </div>
            <div class="preparaty__mini-ix-hints" id="preparaty-mini-ix-hints" data-role="mini-ix-hints" hidden role="listbox" aria-label="Подсказки препаратов"></div>
          </div>
          <button type="button" class="preparaty__mini-ix-check" data-action="mini-ix-check">Проверить взаимодействия</button>
          <div class="preparaty__mini-ix-results" data-role="mini-ix-results" aria-live="polite"></div>
        </div>
      </div>
      <div class="preparaty__mini-panel-foot">
        <button type="button" class="preparaty__mini-panel-add" data-action="cart-add">
          <span aria-hidden="true">+</span>
          <span>Добавить услугу/медикамент</span>
        </button>
        <textarea class="preparaty__cart-note preparaty__mini-rec" data-role="recommendation" rows="1" placeholder="Напишите общую рекомендацию для пациента..." aria-label="Общая рекомендация для пациента"></textarea>
        <div class="preparaty__mini-panel-actions">
          <button type="button" class="preparaty__cart-btn" data-action="cart-write">
            <svg class="preparaty__cart-btn-icon" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M4 2h9l3 3v13H4V2zm8 1.5V6h2.5L12 3.5zM6 9h8v1.5H6V9zm0 3h8v1.5H6V12zm0 3h5V16.5H6V15z"/></svg>
            <span class="preparaty__cart-btn-label"><span>Запись</span><span>в карту</span></span>
          </button>
          <button type="button" class="preparaty__cart-btn" data-action="cart-copy">
            <svg class="preparaty__cart-btn-icon" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M7 2h9v12h-1.5V3.5H7V2zm-3 3h9v13H4V5zm1.5 1.5v10h6v-10h-6z"/></svg>
            <span class="preparaty__cart-btn-label"><span>Скопировать</span><span>выбранное</span></span>
          </button>
        </div>
      </div>
    </aside>

    <button type="button" class="preparaty__dock" data-role="dock" data-action="restore-mini" hidden title="Открыть миникорзинку" aria-label="Открыть миникорзинку EasyMed">
      <img src="assets/logo-white.png" width="101" height="43" alt="" />
    </button>

    <div class="preparaty__popover" data-role="popover" hidden></div>
    <div class="preparaty__info-layer" data-role="info-modal" hidden></div>
    <div class="preparaty__scheme-layer" data-role="scheme-modal" hidden></div>
    <div class="preparaty__scheme-layer preparaty__scheme-layer--combo" data-role="combo-modal" hidden></div>
    <div class="preparaty__note-layer" data-role="note-modal" hidden></div>
    <div class="preparaty__cart-modal-layer" data-role="cart-modal" hidden></div>
  </div>
</section>
